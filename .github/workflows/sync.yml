name: Sync tmwork schedule

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      auth_expired: ${{ steps.run_sync.outputs.auth_expired }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Run sync
        id: run_sync
        run: |
          set +e
          npx tsx src/sync.ts
          code=$?
          set -e
          # Exit code 2 == AuthExpiredError (see src/sync.ts) -- signal that
          # specifically to the refresh-auth job below, distinct from any
          # other kind of failure.
          if [ "$code" -eq 2 ]; then
            echo "auth_expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "auth_expired=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"
        env:
          TMWORK_COOKIE: ${{ secrets.TMWORK_COOKIE }}
          TMWORK_API_TOKEN: ${{ secrets.TMWORK_API_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  # Only runs when `sync` failed specifically due to expired auth. Logs into
  # tmwork directly, pushes fresh TMWORK_COOKIE and TMWORK_API_TOKEN secrets
  # (both are minted per login, not static), then immediately retries the
  # sync in this same job -- see README "About auth expiring" for why an
  # immediate retry matters (and its tradeoffs).
  refresh-auth:
    needs: sync
    if: always() && needs.sync.outputs.auth_expired == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Refresh tmwork session cookie and api token
        run: npx tsx scripts/refresh-auth.ts
        env:
          TMWORK_CODE: ${{ secrets.TMWORK_CODE }}
          TMWORK_USER: ${{ secrets.TMWORK_USER }}
          TMWORK_PASSWORD: ${{ secrets.TMWORK_PASSWORD }}
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}

      # TMWORK_COOKIE / TMWORK_API_TOKEN are deliberately not set here from
      # `secrets.*` -- the secrets context is resolved once at job start, so
      # it would still hold the stale values. The previous step already
      # wrote the freshly validated pair into this job's environment via
      # $GITHUB_ENV, so they're already present here as plain env vars.
      - name: Retry sync immediately with the fresh credentials
        run: npx tsx src/sync.ts
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Notify if refresh or retry failed
        if: failure()
        run: |
          curl -d "tmwork-schedule-sync: automated auth refresh and/or the immediate retry failed. Check the Actions log -- tmwork's login flow may have changed. Manual fix needed." \
            "https://ntfy.sh/${NTFY_TOPIC}"
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
