name: Sync tmwork schedule

# Shifts are published ~2 weeks ahead, but the station can change up to ~1h
# before a shift. So:
#   - DAILY: one full sync a day picks up newly released shifts.
#   - HOURLY: a ~3s check reads the already-published feed and only does a
#     real sync if a shift starts within the next PRE_SHIFT_HOURS. Several
#     chances per shift, because GitHub's scheduled runs are often delayed
#     by an hour or more (and occasionally dropped).
# Odd minutes on purpose: crons at :00 get delayed/dropped the most.
on:
  schedule:
    - cron: "17 11 * * *" # DAILY  -- 6:17am EST / 7:17am EDT
    - cron: "43 * * * *" # HOURLY -- pre-shift check
  workflow_dispatch: {}

# Don't let a manual run and a scheduled run overlap.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  DAILY_CRON: "17 11 * * *" # must match the DAILY cron above exactly
  PRE_SHIFT_HOURS: "6"
  SHIFT_TZ: America/New_York # tmwork shift times are local (floating) time

jobs:
  # Single job: sync.ts logs into tmwork fresh on every run (session cookie +
  # api token are minted per login and expire quickly), so there's no stored
  # session to go stale and no separate refresh-auth job.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether to sync
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CRON" = "$DAILY_CRON" ]; then
            echo "Full sync ($EVENT${CRON:+, cron '$CRON'})"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Hourly check: is a shift starting within the next PRE_SHIFT_HOURS?
          # Fail open -- if the feed can't be read, just sync.
          if ! ics=$(curl -fsS -H "Authorization: Bearer $GIST_TOKEN" \
                "https://api.github.com/gists/$GIST_ID" \
              | jq -r '.files["job1-schedule.ics"].content // empty') || [ -z "$ics" ]; then
            echo "Couldn't read the published feed; syncing anyway"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          now=$(TZ="$SHIFT_TZ" date +%Y%m%dT%H%M%S)
          until=$(TZ="$SHIFT_TZ" date -d "+$PRE_SHIFT_HOURS hours" +%Y%m%dT%H%M%S)
          next=$(printf '%s\n' "$ics" | tr -d '\r' | sed -n 's/^DTSTART://p' \
            | awk -v a="$now" -v b="$until" '$0 >= a && $0 <= b' | sort | head -1)

          if [ -n "$next" ]; then
            echo "Shift starting at $next (within ${PRE_SHIFT_HOURS}h) -- syncing for station changes"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No shift in the next ${PRE_SHIFT_HOURS}h -- nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run sync
        if: steps.gate.outputs.run == 'true'
        run: npx tsx src/sync.ts
        env:
          TMWORK_CODE: ${{ secrets.TMWORK_CODE }}
          TMWORK_USER: ${{ secrets.TMWORK_USER }}
          TMWORK_PASSWORD: ${{ secrets.TMWORK_PASSWORD }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
